[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "analystbench"
version = "0.1.0"
description = "Local-first benchmark platform for open-ended analysis agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AnalystBench Contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
analystbench = "analystbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/analystbench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

